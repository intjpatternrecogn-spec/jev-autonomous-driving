<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">JEV-inspired architecture for autonomous driving</title>
  <desc id="desc">Shared driving state encoding, query-conditioned decision embedding, independent maneuver embeddings, safety masking, parallel scoring, softmax, temporal stability and abstention.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/><stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#10264a" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#41536f"/>
    </marker>
    <style>
      .title{font:700 36px 'DejaVu Sans','Noto Sans SC',sans-serif;fill:#10264a}.sub{font:400 18px 'DejaVu Sans','Noto Sans SC',sans-serif;fill:#52627a}.h{font:700 20px 'DejaVu Sans','Noto Sans SC',sans-serif;fill:#10264a}.t{font:400 16px 'DejaVu Sans','Noto Sans SC',sans-serif;fill:#33445f}.small{font:400 14px 'DejaVu Sans','Noto Sans SC',sans-serif;fill:#52627a}.formula{font:italic 20px Georgia,serif;fill:#2d3b55}.box{stroke-width:2;rx:18;filter:url(#shadow)}.arrow{stroke:#41536f;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#7d8ca3;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="980" rx="28" fill="url(#bg)"/>
  <text x="800" y="58" text-anchor="middle" class="title">JEV-Inspired Autonomous-Driving Decision Architecture</text>
  <text x="800" y="90" text-anchor="middle" class="sub">共享状态一次编码 · 动态候选并行打分 · 确定性安全层保留最终否决权</text>

  <rect x="55" y="145" width="310" height="170" class="box" fill="#dcecff" stroke="#4b86c6"/>
  <text x="210" y="180" text-anchor="middle" class="h">1 · Shared Driving State</text>
  <text x="80" y="218" class="t">ego speed · speed limit</text>
  <text x="80" y="246" class="t">front distance · relative speed</text>
  <text x="80" y="274" class="t">lanes · light · pedestrian</text>
  <text x="210" y="302" text-anchor="middle" class="small">场景上下文只编码一次</text>

  <rect x="55" y="375" width="310" height="130" class="box" fill="#e6ddff" stroke="#7757c5"/>
  <text x="210" y="414" text-anchor="middle" class="h">2 · Typed Question</text>
  <text x="80" y="450" class="t">“Safest useful maneuver</text>
  <text x="80" y="477" class="t">for the next planning step?”</text>

  <rect x="55" y="565" width="310" height="195" class="box" fill="#fff0dc" stroke="#d78b2f"/>
  <text x="210" y="603" text-anchor="middle" class="h">3 · Dynamic Maneuvers</text>
  <rect x="82" y="626" width="118" height="38" rx="10" fill="#fff" stroke="#d78b2f"/><text x="141" y="651" text-anchor="middle" class="small">keep lane</text>
  <rect x="218" y="626" width="118" height="38" rx="10" fill="#fff" stroke="#d78b2f"/><text x="277" y="651" text-anchor="middle" class="small">change left</text>
  <rect x="82" y="680" width="118" height="38" rx="10" fill="#fff" stroke="#d78b2f"/><text x="141" y="705" text-anchor="middle" class="small">change right</text>
  <rect x="218" y="680" width="118" height="38" rx="10" fill="#fff" stroke="#d78b2f"/><text x="277" y="705" text-anchor="middle" class="small">brake</text>
  <text x="210" y="746" text-anchor="middle" class="small">M 可变；每个候选独立编码</text>

  <rect x="470" y="145" width="330" height="170" class="box" fill="#dcecff" stroke="#4b86c6"/>
  <text x="635" y="184" text-anchor="middle" class="h">Shared State Encoder</text>
  <text x="635" y="224" text-anchor="middle" class="formula">Hₓ ∈ ℝᴸˣᵈ</text>
  <g fill="#83b6ec"><rect x="520" y="252" width="38" height="28" rx="6"/><rect x="568" y="252" width="38" height="28" rx="6"/><rect x="616" y="252" width="38" height="28" rx="6"/><rect x="664" y="252" width="38" height="28" rx="6"/><rect x="712" y="252" width="38" height="28" rx="6"/></g>
  <text x="635" y="303" text-anchor="middle" class="small">token memory / hidden states</text>

  <rect x="470" y="375" width="330" height="150" class="box" fill="#e6ddff" stroke="#7757c5"/>
  <text x="635" y="414" text-anchor="middle" class="h">Query–State Interaction</text>
  <text x="635" y="449" text-anchor="middle" class="t">cross-attention / probe</text>
  <text x="635" y="492" text-anchor="middle" class="formula">hqx = F(Hₓ, q) ∈ ℝᵈ</text>

  <rect x="470" y="585" width="330" height="155" class="box" fill="#fff0dc" stroke="#d78b2f"/>
  <text x="635" y="624" text-anchor="middle" class="h">Independent Option Encoder</text>
  <text x="635" y="664" text-anchor="middle" class="formula">O = [o₁ … oM] ∈ ℝᴹˣᵈ</text>
  <text x="635" y="704" text-anchor="middle" class="small">new maneuver ≠ new output layer</text>

  <rect x="900" y="145" width="310" height="190" class="box" fill="#ffe3e3" stroke="#d95656"/>
  <text x="1055" y="183" text-anchor="middle" class="h">Driving Safety Shield</text>
  <text x="930" y="221" class="t">• lane availability</text>
  <text x="930" y="250" class="t">• time-to-collision</text>
  <text x="930" y="279" class="t">• red light / pedestrian</text>
  <text x="1055" y="315" text-anchor="middle" class="small">hard feasible set 𝓕</text>

  <rect x="900" y="395" width="310" height="150" class="box" fill="#fff7d6" stroke="#c49b20"/>
  <text x="1055" y="434" text-anchor="middle" class="h">Dynamics-Aware Priors</text>
  <text x="930" y="472" class="t">progress · comfort · braking</text>
  <text x="1055" y="516" text-anchor="middle" class="formula">bᵢ = transparent domain prior</text>

  <rect x="900" y="605" width="310" height="160" class="box" fill="#e9e4ff" stroke="#7757c5"/>
  <text x="1055" y="644" text-anchor="middle" class="h">Parallel Candidate Scoring</text>
  <text x="1055" y="687" text-anchor="middle" class="formula">zᵢ = (hqxᵀoᵢ + bᵢ) / τ</text>
  <text x="1055" y="728" text-anchor="middle" class="t">masked softmax over i ∈ 𝓕</text>

  <rect x="1315" y="310" width="240" height="255" class="box" fill="#ddf5e8" stroke="#309164"/>
  <text x="1435" y="349" text-anchor="middle" class="h">Typed Decision</text>
  <text x="1342" y="389" class="t">probabilities</text>
  <text x="1342" y="421" class="t">feasibility reasons</text>
  <text x="1342" y="453" class="t">top confidence</text>
  <line x1="1342" y1="477" x2="1528" y2="477" stroke="#8bbca4"/>
  <text x="1435" y="511" text-anchor="middle" class="t">temporal stability</text>
  <text x="1435" y="539" text-anchor="middle" class="t">or human review</text>

  <path d="M365 230 H470" class="arrow"/><path d="M365 440 H470" class="arrow"/><path d="M365 660 H470" class="arrow"/>
  <path d="M635 315 V375" class="arrow"/><path d="M800 450 H855 V655 H900" class="arrow"/><path d="M800 662 H900" class="arrow"/>
  <path d="M1055 335 V395" class="dash"/><path d="M1055 545 V605" class="dash"/><path d="M1210 685 H1260 V438 H1315" class="arrow"/>

  <rect x="105" y="850" width="1390" height="78" rx="18" fill="#fff" stroke="#cbd5e5" stroke-width="2"/>
  <circle cx="155" cy="889" r="12" fill="#4b86c6"/><text x="178" y="895" class="small">shared representation</text>
  <circle cx="385" cy="889" r="12" fill="#7757c5"/><text x="408" y="895" class="small">query-conditioned decision</text>
  <circle cx="690" cy="889" r="12" fill="#d78b2f"/><text x="713" y="895" class="small">dynamic candidates</text>
  <circle cx="925" cy="889" r="12" fill="#d95656"/><text x="948" y="895" class="small">our safety improvements</text>
  <circle cx="1215" cy="889" r="12" fill="#309164"/><text x="1238" y="895" class="small">bounded output</text>
  <text x="800" y="962" text-anchor="middle" class="small">Research architecture · normalized demo probabilities are not empirically calibrated · never connect directly to vehicle actuation</text>
</svg>
